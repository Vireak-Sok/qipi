<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183d38" />
    <title>Qipi — Moderation</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/admin.js"></script>
  </head>
  <body class="admin-body">
    <header class="site-header"><div class="shell header-inner"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span><span class="brand-word">qi<span>pi</span></span></a><a class="button button-ghost" href="/">← Back to Qipi</a></div></header>
    <main class="shell admin-main">
      <p class="section-kicker">LOCAL DEMO / ADMIN</p>
      <h1>Moderation desk</h1>
      <p class="section-subtitle">Review route notes and reports before they affect the public trip board.</p>
      <form id="admin-login" class="admin-card" style="max-width:480px;margin-top:28px">
        <h2>Enter your local admin token</h2>
        <div class="field"><label for="admin-token">Admin token</label><input id="admin-token" type="password" autocomplete="off" required /></div>
        <button class="button button-primary" type="submit">Open moderation →</button>
        <p id="admin-login-error" class="error-message" role="alert"></p>
      </form>
      <section id="admin-dashboard" hidden>
        <div class="admin-grid">
          <section class="admin-card"><h2>Activity</h2><div id="admin-stats" class="stat-grid"></div></section>
          <section class="admin-card"><h2>Reports to review</h2><div id="admin-reports"></div></section>
          <section class="admin-card"><h2>Route notes to review</h2><div id="admin-updates"></div></section>
          <section class="admin-card"><h2>Visible trips</h2><div id="admin-trips"></div></section>
        </div>
      </section>
    </main>
  </body>
</html>
